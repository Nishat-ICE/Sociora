<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sociora - Reset Password</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-logo">
                S
            </div>


            <h1>
                Reset password
            </h1>


            <p class="auth-subtitle">
                Create a new password for your account.
            </p>


            <form
                id="resetForm"
            >

                <div class="input-group">

                    <label>
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Minimum 6 characters"
                        minlength="6"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Reset Password
                </button>


                <div
                    id="message"
                    class="auth-message"
                ></div>

            </form>

        </div>

    </div>


    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const token =
            params.get("token");


        const form =
            document.getElementById(
                "resetForm"
            );


        const message =
            document.getElementById(
                "message"
            );


        form.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                if (!token) {

                    message.textContent =
                        "Invalid reset link.";

                    return;

                }


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                const confirmPassword =
                    document.getElementById(
                        "confirmPassword"
                    ).value;


                if (
                    password !==
                    confirmPassword
                ) {

                    message.textContent =
                        "Passwords do not match.";

                    return;

                }


                try {

                    const response =
                        await fetch(
                            "/api/auth/reset-password",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({
                                        token,
                                        password
                                    })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.message ||
                            "Reset failed.";

                        return;

                    }


                    message.style.color =
                        "#16a34a";


                    message.textContent =
                        "Password reset successfully. Redirecting...";


                    setTimeout(
                        function () {

                            window.location.href =
                                "login.html";

                        },
                        1500
                    );

                } catch (error) {

                    message.textContent =
                        "Server error.";

                }

            }
        );

    </script>

</body>

</html>
