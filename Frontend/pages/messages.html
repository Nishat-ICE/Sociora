<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sociora - Messages</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .messages-page {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .messages-box {
            height: 650px;

            display: grid;

            grid-template-columns:
                280px
                1fr;

            background: var(--card);

            border-radius: 20px;

            overflow: hidden;

            box-shadow: var(--shadow);
        }


        .users-panel {
            border-right:
                1px solid var(--border);

            overflow-y: auto;
        }


        .users-header {
            padding: 20px;

            border-bottom:
                1px solid var(--border);
        }


        .users-header h2 {
            font-size: 20px;
        }


        .user-item {
            display: flex;

            align-items: center;

            gap: 12px;

            padding: 14px 16px;

            cursor: pointer;

            border-bottom:
                1px solid var(--border);
        }


        .user-item:hover,
        .user-item.active {
            background: var(--bg);
        }


        .user-avatar {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-weight: 700;
        }


        .chat-panel {
            display: flex;

            flex-direction: column;
        }


        .chat-header {
            padding: 18px;

            border-bottom:
                1px solid var(--border);

            font-weight: 700;
        }


        .messages-list {
            flex: 1;

            overflow-y: auto;

            padding: 20px;
        }


        .message {
            display: flex;

            margin-bottom: 12px;
        }


        .message.sent {
            justify-content: flex-end;
        }


        .message-bubble {
            max-width: 70%;

            padding: 10px 14px;

            border-radius: 14px;

            background: var(--bg);

            font-size: 14px;

            line-height: 1.5;
        }


        .message.sent
        .message-bubble {
            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;
        }


        .message-time {
            display: block;

            margin-top: 4px;

            font-size: 10px;

            opacity: 0.6;
        }


        .message-form {
            display: flex;

            gap: 10px;

            padding: 15px;

            border-top:
                1px solid var(--border);
        }


        .message-form input {
            flex: 1;

            padding: 12px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: transparent;

            color: var(--text);

            outline: none;
        }


        .message-form button {
            border: none;

            padding: 0 20px;

            border-radius: 10px;

            background: var(--primary);

            color: white;

            cursor: pointer;
        }


        .empty-chat {
            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--muted);

            text-align: center;
        }


        @media(max-width:700px) {

            .messages-page {
                padding: 10px;
            }

            .messages-box {
                grid-template-columns:
                    110px
                    1fr;

                height: calc(100vh - 100px);
            }

            .users-header h2 {
                font-size: 14px;
            }

            .user-item {
                justify-content: center;
            }

            .user-item .user-name {
                display: none;
            }

        }

    </style>

</head>


<body>


<header class="navbar">

    <a
        href="../index.html"
        class="brand"
    >

        <div class="brand-logo">

            <svg viewBox="0 0 50 50" fill="none">

                <path
                    d="M35 13C31 10 27 8 22 8C16 8 12 11 12 16C12 21 16 23 24 25C32 27 37 30 37 36C37 42 32 45 25 45C19 45 14 43 10 39"
                    stroke="white"
                    stroke-width="5"
                    stroke-linecap="round"
                />

            </svg>

        </div>

        <span>Sociora</span>

    </a>


    <a
        href="../index.html"
        class="side-link"
    >
        ← Home
    </a>

</header>



<main class="messages-page">


    <div class="messages-box">


        <!-- USERS -->

        <div class="users-panel">

            <div class="users-header">

                <h2>
                    Messages
                </h2>

            </div>


            <div id="usersList">

                <div class="empty-chat">
                    Loading...
                </div>

            </div>

        </div>



        <!-- CHAT -->

        <div class="chat-panel">


            <div
                class="chat-header"
                id="chatHeader"
            >
                Select a user
            </div>


            <div
                class="messages-list"
                id="messagesList"
            >

                <div class="empty-chat">

                    <div>

                        <h3>
                            Start a conversation
                        </h3>

                        <p>
                            Select a user from the left.
                        </p>

                    </div>

                </div>

            </div>


            <div
                class="message-form"
                id="messageForm"
                style="display:none;"
            >

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Write a message..."
                >

                <button
                    onclick="sendMessage()"
                >
                    Send
                </button>

            </div>


        </div>

    </div>

</main>



<script>

let currentUser = null;
let selectedUser = null;
let refreshTimer = null;


// ======================================================
// INIT
// ======================================================

async function init() {

    const response =
        await fetch(
            "/api/auth/me",
            {
                credentials: "include"
            }
        );


    const data =
        await response.json();


    if (!data.user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser =
        data.user;


    await loadUsers();

}


init();


// ======================================================
// LOAD USERS
// ======================================================

async function loadUsers() {

    const response =
        await fetch(
            "/api/users",
            {
                credentials: "include"
            }
        );


    const users =
        await response.json();


    const container =
        document.getElementById(
            "usersList"
        );


    if (!users.length) {

        container.innerHTML = `
            <div class="empty-chat">
                No users found.
            </div>
        `;

        return;

    }


    container.innerHTML =
        users.map(user => {

            const letter =
                user.username
                    .charAt(0)
                    .toUpperCase();


            return `

                <div
                    class="user-item"
                    onclick="selectUser(${user.id})"
                >

                    <div class="user-avatar">
                        ${letter}
                    </div>

                    <div class="user-name">
                        <strong>
                            ${escapeHTML(user.username)}
                        </strong>
                    </div>

                </div>

            `;

        }).join("");

}


// ======================================================
// SELECT USER
// ======================================================

async function selectUser(userId) {

    const response =
        await fetch(
            "/api/users",
            {
                credentials: "include"
            }
        );


    const users =
        await response.json();


    selectedUser =
        users.find(
            user =>
                Number(user.id) ===
                Number(userId)
        );


    if (!selectedUser) {
        return;
    }


    document.getElementById(
        "chatHeader"
    ).textContent =
        "@" + selectedUser.username;


    document.getElementById(
        "messageForm"
    ).style.display =
        "flex";


    await loadMessages();


    clearInterval(
        refreshTimer
    );


    refreshTimer =
        setInterval(
            loadMessages,
            3000
        );

}


// ======================================================
// LOAD MESSAGES
// ======================================================

async function loadMessages() {

    if (!selectedUser) {
        return;
    }


    const response =
        await fetch(
            `/api/messages/${selectedUser.id}`,
            {
                credentials: "include"
            }
        );


    const messages =
        await response.json();


    const container =
        document.getElementById(
            "messagesList"
        );


    container.innerHTML =
        messages.map(
            message => {

                const sent =
                    Number(message.sender_id) ===
                    Number(currentUser.id);


                return `

                    <div
                        class="message
                        ${sent ? "sent" : ""}"
                    >

                        <div
                            class="message-bubble"
                        >

                            ${escapeHTML(
                                message.message
                            )}

                            <span
                                class="message-time"
                            >
                                ${formatDate(
                                    message.created_at
                                )}
                            </span>

                        </div>

                    </div>

                `;

            }
        ).join("");


    container.scrollTop =
        container.scrollHeight;

}


// ======================================================
// SEND MESSAGE
// ======================================================

async function sendMessage() {

    if (!selectedUser) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    const response =
        await fetch(
            "/api/messages",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                credentials: "include",

                body:
                    JSON.stringify({
                        receiver_id:
                            selectedUser.id,

                        message:
                            message
                    })
            }
        );


    const result =
        await response.json();


    if (!response.ok) {

        alert(
            result.message ||
            "Failed to send message."
        );

        return;

    }


    input.value = "";

    loadMessages();

}


// ======================================================
// ENTER TO SEND
// ======================================================

document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


// ======================================================
// HELPERS
// ======================================================

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;

}


function formatDate(date) {

    const d =
        new Date(date);

    return d.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}

</script>

</body>

</html>
