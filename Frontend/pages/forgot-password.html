<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sociora - Forgot Password</title>

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <div class="auth-wrapper">

        <div class="auth-card">

            <div class="auth-logo">
                S
            </div>


            <h1>
                Forgot password?
            </h1>


            <p class="auth-subtitle">
                Enter your email and we'll send you
                a password reset link.
            </p>


            <form
                id="forgotForm"
            >

                <div class="input-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                >
                    Send Reset Link
                </button>


                <div
                    id="message"
                    class="auth-message"
                ></div>

            </form>


            <p class="auth-footer">

                Remember your password?

                <a
                    href="login.html"
                >
                    Back to Login
                </a>

            </p>

        </div>

    </div>


    <script>

        document
            .getElementById("forgotForm")
            .addEventListener(
                "submit",
                async function (event) {

                    event.preventDefault();


                    const email =
                        document.getElementById(
                            "email"
                        ).value;


                    const message =
                        document.getElementById(
                            "message"
                        );


                    message.textContent =
                        "Processing...";


                    try {

                        const response =
                            await fetch(
                                "/api/auth/forgot-password",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            email
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        message.style.color =
                            "#16a34a";


                        message.textContent =
                            data.message ||
                            "Reset link generated.";

                    } catch (error) {

                        message.style.color =
                            "#ef4444";


                        message.textContent =
                            "Something went wrong.";

                    }

                }
            );

    </script>

</body>

</html>
